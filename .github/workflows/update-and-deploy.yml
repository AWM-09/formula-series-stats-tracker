name: Update Formula Stats and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: formula-stats-pages
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript
        run: node --check app.js && node --check scripts/fetch-f1-data.js && node --check scripts/build-indexes.js
      - name: Fetch F1 historical data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        id: fetch_data
        continue-on-error: true
        env:
          HISTORICAL_QUALIFYING_BACKFILL_ONLY: ${{ github.event_name == 'push' }}
        run: node scripts/fetch-f1-data.js
      - name: Set up Python for F2/F3 imports
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install F2/F3 and circuit import dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 pyyaml pypdf openpyxl
          python -m py_compile scripts/fetch-f2-f3-data.py scripts/fetch-f1-practice.py scripts/fetch-news.py scripts/fetch-circuit-data.py scripts/fetch-fia-grid-penalties.py scripts/import-historical-grid-penalties.py scripts/import-series-grid-penalties.py scripts/build-f1-upgrade-watch.py
      - name: Install FastF1 for scheduled historical refreshes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m pip install --disable-pip-version-check fastf1
      - name: Import completed current-season F1 practice classifications
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: fetch_practice
        continue-on-error: true
        run: python scripts/fetch-f1-practice.py
      - name: Fetch historical F2 and F3 data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: fetch_series
        continue-on-error: true
        run: python scripts/fetch-f2-f3-data.py
      - name: Refresh F1, F2 and F3 news snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: fetch_news
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
        run: python scripts/fetch-news.py
      - name: Import verified circuit layouts and track specifications
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: fetch_circuits
        continue-on-error: true
        run: python scripts/fetch-circuit-data.py
      - name: Import official FIA grid-penalty documents
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: fetch_grid_penalties
        continue-on-error: true
        run: python scripts/fetch-fia-grid-penalties.py
      - name: Import historical F1 grid penalties (2020 onward)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: fetch_grid_history
        continue-on-error: true
        run: python scripts/import-historical-grid-penalties.py
      - name: Import official F2 and F3 grid penalties
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: fetch_f2_f3_grid_penalties
        continue-on-error: true
        run: python scripts/import-series-grid-penalties.py
      - name: Build F1 team upgrade watch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: build_upgrade_watch
        continue-on-error: true
        run: python scripts/build-f1-upgrade-watch.py
      - name: Build searchable career and circuit indexes
        run: node scripts/build-indexes.js
      - name: Save every completed historical snapshot
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/f1 data/f2 data/f3
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Save F1 data checkpoints [skip ci]"
            git push
          else
            echo "No new data snapshots to save."
          fi
      - name: Stop if the F1 data import was incomplete
        if: steps.fetch_data.outcome == 'failure'
        run: |
          echo "The F1 data import did not finish. Completed season files were saved; rerun this workflow to resume."
          exit 1
      - name: Stop if the F2/F3 import was incomplete
        if: steps.fetch_series.outcome == 'failure'
        run: |
          echo "The F2/F3 import did not finish. Completed season files were saved; rerun this workflow to resume."
          exit 1
      - name: Verify historical coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s data/f1/1950.json
          test -s data/f1/$(date -u +%Y).json
          test -s data/f2/2017.json
          test -s data/f2/$(date -u +%Y).json
          test -s data/f3/2019.json
          test -s data/f3/$(date -u +%Y).json
          test -s data/indexes/f1-drivers.json
          test -s data/indexes/f1-teams.json
          test -s data/indexes/f1-circuits.json
          test -s data/indexes/f2-drivers.json
          test -s data/indexes/f3-drivers.json
          test -d data/profiles/f1/drivers
          node - <<'NODE'
          for (const [series, year] of [["f1",1950],["f2",2017],["f3",2019]]) {
            const x = require("./data/" + series + "/" + year + ".json");
            if (x.season !== year || !Array.isArray(x.races) || !Array.isArray(x.driverStandings) || !x.driverStandings.length) process.exit(1);
            console.log(series.toUpperCase(), year, "verified:", x.driverStandings.length, "drivers,", x.races.length, "events");
          }
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
